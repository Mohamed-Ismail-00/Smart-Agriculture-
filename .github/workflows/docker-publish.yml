name: Build and Push Docker Image

# Manual only in this fork: the Docker Hub secrets belong to the original project.
on:
  workflow_dispatch:
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}/agri-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}/agri-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}/agri-backend:buildcache,mode=max
